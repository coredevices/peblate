[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peblate"
version = "0.1.0"
description = "PebbleOS font management and firmware previews for stock Weblate"
requires-python = ">=3.12"
dependencies = ["pebbleos-translations==0.1.0", "google-auth[requests]>=2.40,<3", "CacheControl>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peblate = ["templates/**/*.html", "templates/*.html", "static/**/*"]
