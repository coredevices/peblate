{% if enabled %}
<template id="pebble-editor-panel-template">
<section class="card string-info" id="pebble-editor-panel" aria-label="Language setup and watch preview">
  <div class="card-header"><h4 class="card-title">{{ language_name }} on your watch</h4></div>
  <div class="card-body">
    <details class="pebble-setup" open>
      <summary>Getting your language ready</summary>
      <ol class="small mt-2">
        <li>Translate and save strings in Weblate. New languages start from the released English strings.</li>
        <li>Check the language to find missing characters. Built-in fonts may already cover your language.</li>
        <li>Supply fonts and licenses where needed, preview the result, then build a draft to try on a watch.</li>
      </ol>
      <p class="small">You choose the fonts. Required characters are selected automatically from the language and its translations.</p>
    </details>
    {% if not baseline_known %}<p class="small pebble-warning">We do not have a baseline character list for this language. Check coverage as you translate.</p>
    {% elif baseline_needs_fonts %}<p class="small pebble-warning">The built-in fonts alone do not cover this language. Use custom fonts below and check your translations to verify coverage.</p>
    {% else %}<p class="small">The built-in text fonts cover this language’s baseline characters. Additional characters in your translations are checked separately.</p>{% endif %}
    <h5 class="mt-3">Watch preview</h5>
    <p class="text-body-secondary small">Follows the translation field you’re editing, including unsaved text.</p>
    <label for="pebble-style" class="form-label">Preview text style</label>
    <select id="pebble-style" class="form-select form-select-sm">{% for slot in slots %}<option value="{{ slot.name }}" {% if slot.name == 'GOTHIC_18_EXTENDED' %}selected{% endif %}>{{ slot.label }}</option>{% endfor %}</select>
    <div class="pebble-watch"><div class="pebble-screen"><canvas id="pebble-fw-preview" width="144" height="168" aria-label="Firmware text preview"></canvas><div id="pebble-preview-text" dir="auto"></div></div></div>
    <p id="pebble-font-status" class="small text-body-secondary"></p>
    <p class="small text-body-secondary">Firmware text rendering in a sample 144 × 168 text box. Check that the text is readable and fits. Full watch-screen layouts still need review.</p>
    <hr>
    <details id="pebble-font-details"><summary>Fonts for {{ language_name }}</summary>
      <p class="small mt-2">Required characters come from this language and its translations automatically. Upload a font only when validation finds missing characters. You choose the font and must have permission to distribute it.</p>
      <details class="mb-3"><summary id="pebble-font-overview-summary">Font assignments</summary><div id="pebble-font-overview" class="small mt-2" aria-label="Assigned fonts"></div></details>
      <form id="pebble-font-form" method="post" enctype="multipart/form-data" action="{% url 'pebble-upload' code %}">
        {% csrf_token %}<input type="hidden" name="format" value="json">
        <fieldset {% if not permissions.upload %}disabled{% endif %}>
        <label class="form-label small" for="pebble-font-slot">Use this font for</label>
        <select id="pebble-font-slot" name="slot" class="form-select form-select-sm">{% for slot in slots %}<option value="{{ slot.name }}" {% if slot.name == 'GOTHIC_18_EXTENDED' %}selected{% endif %}>{{ slot.label }}</option>{% endfor %}</select>
        <p id="pebble-current-font" class="small mt-2" role="status"></p>
        <label class="form-label small" for="pebble-reuse-font">Font source</label>
        <select id="pebble-reuse-font" name="reuse_slot" class="form-select form-select-sm"><option value="">Upload a new font and license</option></select>
        <div id="pebble-new-font-fields">
        <label class="form-label small mt-2" for="pebble-font-file">New TTF or OTF font</label>
        <input type="file" id="pebble-font-file" class="form-control form-control-sm" name="font" accept=".ttf,.otf" required>
        <label class="form-label small mt-2" for="pebble-font-license">Font license (text or PDF, required)</label>
        <input type="file" id="pebble-font-license" name="license" class="form-control form-control-sm" accept=".txt,.md,.pdf" required>
        </div>
        <p class="small">Use the same font file for multiple styles if needed. Identical font and license files are stored once.</p>
        <button class="btn btn-secondary btn-sm mt-2" type="submit">Upload font</button>
        <p id="pebble-upload-status" class="small mt-2" role="status"></p>
        </fieldset>
        {% if not permissions.upload %}<p class="small">You can preview this language, but your Weblate role cannot change its fonts.</p>{% endif %}
      </form>
    </details>
    <hr>
    <h5>Draft pack readiness</h5>
    <p id="pebble-readiness" class="small" role="status">Not checked yet. Check saved translations to see coverage and build issues.</p>
    <p class="small">One pack works across supported watches. A successful build does not mean the translation is approved for publication.</p>
    <p id="pebble-save-hint" class="small text-body-secondary">Checks and downloads use saved translations.</p>
    <form id="pebble-validation-form" action="{% url 'pebble-validate' code %}" method="post">
      {% csrf_token %}<input type="hidden" name="format" value="json">
      <fieldset {% if not permissions.validate %}disabled{% endif %}><div class="d-flex flex-wrap gap-2"><button type="submit" name="action" value="validate" class="btn btn-secondary btn-sm">Check language</button><button type="submit" name="action" value="build" class="btn btn-secondary btn-sm">Build draft</button></div></fieldset>
      {% if not permissions.validate %}<p class="small">Language checks and draft builds require translation editing and download permissions.</p>{% endif %}
    </form>
    <div id="pebble-validation-status" class="small mt-3" role="status"></div>
  </div>
</section>
{{ slots|json_script:'pebble-slot-config' }}
</template>
{% endif %}
